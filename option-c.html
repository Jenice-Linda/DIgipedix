<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digipedix — Option C · Orbit selector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>

body{margin:0;background:#161616}
a{color:#FA4812}a:hover{color:#FF7A4D}

.oc-root{--hot:#FA4812;--text:#F4F4F4;--muted:#9FA1A2;--line:rgba(159,161,162,.24);--R:210px;--orb:150px;--big:270px}
.oc-root button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
.oc-root button:focus-visible{outline:2px solid var(--hot);outline-offset:4px}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.ico{fill:none;stroke:currentColor;stroke-width:1.5px;stroke-linecap:square;stroke-linejoin:miter}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rise{animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) both}
.dl1{animation-delay:.08s}.dl2{animation-delay:.16s}.dl3{animation-delay:.24s}

/* header */
.oc-root .lang{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px;border:1px solid rgba(159,161,162,.55);border-radius:4px;color:#C9CBCC;font-size:11px;letter-spacing:.04em}
.oc-root .lang:hover{border-color:#F4F4F4;color:#F4F4F4}
.oc-root .signin{font-size:13px;color:#E6E7E8;text-decoration:none}
.oc-root .signin:hover{color:#FFFFFF}

/* module list */
.oc-root .mod{display:flex;align-items:center;gap:8px;width:100%;max-width:240px;min-height:44px;padding:0 12px;box-sizing:border-box;border-radius:4px;color:var(--text);font-weight:600;font-size:16px;transition:background .25s,color .25s}
.mod .arr{margin-left:auto;font-size:18px;line-height:1;opacity:0;transition:opacity .25s}
.oc-root .mod.hot,.oc-root .mod.on{background:var(--hot);color:#FFFFFF}
.mod.hot .arr,.mod.on .arr{opacity:1}

/* stage backdrop */
.bg{position:absolute;pointer-events:none}
.bg-dots{inset:0;background-image:radial-gradient(circle,rgba(159,161,162,.3) 1px,transparent 1.4px);background-size:28px 28px;background-position:center;-webkit-mask-image:radial-gradient(ellipse 55% 70% at 55% 50%,#000 0%,transparent 100%);mask-image:radial-gradient(ellipse 55% 70% at 55% 50%,#000 0%,transparent 100%)}
.bg-light{left:50%;top:50%;width:min(820px,100%);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(159,161,162,.13) 0%,rgba(159,161,162,.04) 45%,transparent 70%)}
.ring{left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%);border:1px solid rgba(159,161,162,.2)}
.ring.r-in{width:calc(var(--R) * 1.74);height:calc(var(--R) * 1.74)}
.ring.r-out{width:calc(var(--R) * 2.86);height:calc(var(--R) * 2.86);border-color:rgba(159,161,162,.14)}
.lbl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:.04em;color:#C9CBCC;white-space:nowrap;transition:color .3s}
.h-hip .l-hip,.h-knee .l-knee,.h-trauma .l-trauma,.s-hip .l-hip,.s-knee .l-knee,.s-trauma .l-trauma{color:var(--hot)}

/* orbit: slow continuous spin, plus a quarter-turn nudge when a module is chosen */
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes unspin{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.orbit{position:absolute;left:50%;top:50%;width:0;height:0}
.spin{position:absolute;inset:0;animation:spin 140s linear infinite}
.turn{position:absolute;inset:0;transition:transform 1.6s cubic-bezier(.6,0,.2,1)}
.slot{position:absolute;left:0;top:0;width:0;height:0}
.slot-hip{transform:rotate(40deg) translateX(var(--R)) rotate(-40deg)}
.slot-knee{transform:rotate(-72deg) translateX(var(--R)) rotate(72deg)}
.slot-trauma{transform:rotate(172deg) translateX(var(--R)) rotate(-172deg)}
.unturn{position:absolute;inset:0;transition:transform 1.6s cubic-bezier(.6,0,.2,1)}
.unspin{position:absolute;inset:0;animation:unspin 140s linear infinite}
.oc-root .orb{position:absolute;left:calc(var(--orb) / -2);top:calc(var(--orb) / -2);width:var(--orb);height:var(--orb);border-radius:50%;transition:transform 1s cubic-bezier(.6,0,.2,1),opacity .6s,filter .3s}
.orb .fl{display:block;width:100%;height:100%;animation:float 6s ease-in-out infinite}
.orb-knee .fl{animation-delay:-2s}.orb-trauma .fl{animation-delay:-4s}
.orb img{display:block;width:100%;height:100%;border-radius:50%}
.orb .halo{position:absolute;inset:-6px;border-radius:50%;box-shadow:0 0 0 1px rgba(250,72,18,0),0 0 0 rgba(250,72,18,0);transition:box-shadow .3s}
.h-hip .orb-hip .halo,.h-knee .orb-knee .halo,.h-trauma .orb-trauma .halo{box-shadow:0 0 0 1px rgba(250,72,18,.8),0 0 28px rgba(250,72,18,.35)}
.picked .orb{transform:scale(.62)}
.s-hip .orb-hip,.s-knee .orb-knee,.s-trauma .orb-trauma{opacity:.35}

/* centre: the chosen module grows in */
.centre{position:absolute;left:50%;top:50%;width:var(--big);height:var(--big);margin:calc(var(--big) / -2) 0 0 calc(var(--big) / -2);pointer-events:none}
.oc-root .big{position:absolute;inset:0;border-radius:50%;opacity:0;transform:scale(.3);transition:transform 1.1s cubic-bezier(.3,.7,.2,1),opacity .6s ease;pointer-events:none}
.big img{display:block;width:100%;height:100%;border-radius:50%}
.oc-root .big.on{opacity:1;transform:scale(1);pointer-events:auto;transition-delay:.25s}
.big.on .fl{animation:float 7s ease-in-out 1.4s infinite}
.big .fl{display:block;width:100%;height:100%}
.big .glow{position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(circle,rgba(250,72,18,.22) 0%,rgba(250,72,18,.06) 45%,transparent 70%);z-index:-1}

@keyframes panelIn{from{opacity:0}to{opacity:1}}
.oc-root .launch{position:absolute;inset:0;z-index:20;background:#161616;display:flex;animation:panelIn .4s ease-out both}

@media (max-width:900px){.oc-root{--R:140px;--orb:100px;--big:200px}.lbl{display:none}}
@media (prefers-reduced-motion:reduce){.oc-root *{animation:none !important;transition:none !important}}

[hidden]{display:none !important}
</style>
</head>
<body>
<div class="oc-root" id="root" style="position: relative; min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: #161616; color: #F4F4F4; font-family: 'Space Grotesk', 'Helvetica Neue', Helvetica, sans-serif">
<header class="rise" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px clamp(20px, 3vw, 40px); border-bottom: 1px solid rgba(159,161,162,.24); position: relative; z-index: 5">
<a href="index.html" aria-label="All concepts" style="display: flex; text-decoration: none">
<img src="assets/logo.png" alt="Digipedix" style="display: block; width: 30px; height: 42px; object-fit: contain">
</a>
<nav aria-label="Account" style="display: flex; align-items: center; gap: 28px">
<button type="button" class="lang" aria-label="Language: English">
<svg class="ico" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"></path></svg>
<span>EN</span>
<svg class="ico" width="10" height="10" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<a class="signin" href="#">Sign in</a>
</nav>
</header>
<main style="flex: 1; position: relative; display: flex; flex-wrap: wrap; align-items: stretch; min-height: 680px">
<div class="bg bg-dots"></div>
<section style="position: relative; z-index: 4; flex: 0 1 360px; min-width: 260px; box-sizing: border-box; padding: clamp(28px, 5vw, 64px) clamp(20px, 3vw, 48px); display: flex; flex-direction: column; justify-content: center; gap: 40px">
<div style="display: flex; flex-direction: column; gap: 14px">
<h1 class="rise dl1" style="margin: 0; font-weight: 600; font-size: clamp(26px, 2.2vw, 32px); line-height: 1.15; letter-spacing: -.01em">Select a module</h1>
<p class="rise dl2" style="margin: 0; max-width: 30ch; font-size: 15px; line-height: 1.5; color: #C9CBCC">Choose a region on the skeleton, or pick from the list.</p>
</div>
<div class="rise dl3" style="display: flex; flex-direction: column; gap: 6px">
<button type="button" class="mod" data-id="hip" aria-pressed="false">
<span>01 Hip</span>
<span class="arr" aria-hidden="true">→</span>
</button>
<button type="button" class="mod" data-id="knee" aria-pressed="false">
<span>02 Knee</span>
<span class="arr" aria-hidden="true">→</span>
</button>
<button type="button" class="mod" data-id="trauma" aria-pressed="false">
<span>03 Trauma</span>
<span class="arr" aria-hidden="true">→</span>
</button>
</div>
</section>
<section style="position: relative; flex: 999 1 560px; min-width: 0; min-height: 680px; overflow: hidden">
<div class="bg bg-light"></div>
<div class="bg ring r-out"></div>
<div class="bg ring r-in"></div>
<span class="lbl l-knee" style="margin: -190px 0 0 -170px">02 Knee</span>
<span class="lbl l-hip" style="margin: -42px 0 0 300px">01 Hip</span>
<span class="lbl l-trauma" style="margin: 270px 0 0 -96px">03 Trauma</span>
<div class="orbit">
<div class="spin">
<div class="turn" id="turn">
<div class="slot slot-hip">
<div class="unturn">
<div class="unspin">
<button type="button" class="orb orb-hip" data-id="hip" aria-label="Select Hip module">
<span class="halo"></span>
<span class="fl"><img src="assets/module-hip.png" alt=""></span>
</button>
</div>
</div>
</div>
<div class="slot slot-knee">
<div class="unturn">
<div class="unspin">
<button type="button" class="orb orb-knee" data-id="knee" aria-label="Select Knee module">
<span class="halo"></span>
<span class="fl"><img src="assets/module-knee.png" alt=""></span>
</button>
</div>
</div>
</div>
<div class="slot slot-trauma">
<div class="unturn">
<div class="unspin">
<button type="button" class="orb orb-trauma" data-id="trauma" aria-label="Select Trauma module">
<span class="halo"></span>
<span class="fl"><img src="assets/module-trauma.png" alt=""></span>
</button>
</div>
</div>
</div>
</div>
</div>
</div>
<div class="centre">
<button type="button" class="big" data-id="hip" tabindex="-1" aria-label="Open Hip module">
<span class="glow"></span>
<span class="fl"><img src="assets/module-hip.png" alt=""></span>
</button>
<button type="button" class="big" data-id="knee" tabindex="-1" aria-label="Open Knee module">
<span class="glow"></span>
<span class="fl"><img src="assets/module-knee.png" alt=""></span>
</button>
<button type="button" class="big" data-id="trauma" tabindex="-1" aria-label="Open Trauma module">
<span class="glow"></span>
<span class="fl"><img src="assets/module-trauma.png" alt=""></span>
</button>
</div>
</section>
</main>
<button type="button" class="launch" id="launch" hidden aria-label="Back to module selection">
<span style="margin: auto; display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; padding: 24px">
<span class="mono" style="font-size: 12px; letter-spacing: .08em; color: #FA4812">OPENING MODULE</span>
<span id="selName" style="font-weight: 600; font-size: clamp(48px, 7vw, 96px); line-height: 1; letter-spacing: -.02em; color: #F4F4F4"></span>
<span style="font-size: 15px; color: #9FA1A2">[Module screen goes here] · click to go back</span>
</span>
</button>
</div>
<script>
(function () {
  var NAMES = { hip: 'Hip', knee: 'Knee', trauma: 'Trauma' };
  var BASE = { hip: 40, knee: -72, trauma: 172 }, PARK = 165;
  var state = { sel: null, hov: null, go: false, rot: 0 };
  var root = document.getElementById('root');
  var q = function (s) { return [].slice.call(document.querySelectorAll(s)); };
  var rows = q('.mod'), orbs = q('.orb'), bigs = q('.big'), unturns = q('.unturn');
  var turn = document.getElementById('turn'), launch = document.getElementById('launch');
  function choose(id) {
    if (state.sel === id) { state.go = true; render(); return; }
    var delta = (((PARK - BASE[id] - state.rot) % 360) + 360) % 360;
    if (delta < 40) delta += 360;
    state.rot += delta; state.sel = id; render();
  }
  function render() {
    root.className = 'oc-root' + (state.hov ? ' h-' + state.hov : '') + (state.sel ? ' picked s-' + state.sel : '');
    rows.forEach(function (b) {
      var id = b.dataset.id;
      b.className = 'mod' + (state.sel === id ? ' on' : '') + (state.hov === id && state.sel !== id ? ' hot' : '');
      b.setAttribute('aria-pressed', String(state.sel === id));
    });
    bigs.forEach(function (b) { var on = b.dataset.id === state.sel; b.className = 'big' + (on ? ' on' : ''); b.tabIndex = on ? 0 : -1; });
    turn.style.transform = 'rotate(' + state.rot + 'deg)';
    unturns.forEach(function (u) { u.style.transform = 'rotate(' + (-state.rot) + 'deg)'; });
    launch.hidden = !(state.go && state.sel);
    document.getElementById('selName').textContent = state.sel ? NAMES[state.sel] : '';
  }
  function hover(el) {
    var on = function () { state.hov = el.dataset.id; render(); };
    var off = function () { state.hov = null; render(); };
    el.addEventListener('mouseenter', on); el.addEventListener('focus', on);
    el.addEventListener('mouseleave', off); el.addEventListener('blur', off);
  }
  rows.concat(orbs).forEach(function (b) { hover(b); b.addEventListener('click', function () { choose(b.dataset.id); }); });
  bigs.forEach(function (b) { b.addEventListener('click', function () { if (state.sel) { state.go = true; render(); } }); });
  launch.addEventListener('click', function () { state.go = false; render(); });
  render();
})();
</script>
</body>
</html>
